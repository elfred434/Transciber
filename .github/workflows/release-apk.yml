name: APK debug sur version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Construire l’APK
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Construire l’APK debug
        run: ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"

      - name: Préparer l’APK de la release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "transciber-${GITHUB_REF_NAME}-debug.apk"

      - name: Publier l’APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: transciber-${{ github.ref_name }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Créer la GitHub Release et joindre l’APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Transciber ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: transciber-${{ github.ref_name }}-debug.apk
          fail_on_unmatched_files: true
