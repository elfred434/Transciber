name: APK debug sur version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construire l’APK
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Construire l’APK debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publier l’APK de la version
        uses: actions/upload-artifact@v4
        with:
          name: transciber-${{ github.ref_name }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
